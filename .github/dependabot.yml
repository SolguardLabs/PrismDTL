version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      rust-crates:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - bun
    groups:
      bun-dependencies:
        patterns:
          - "*"
