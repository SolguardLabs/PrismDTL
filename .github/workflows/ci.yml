name: CI

on:
  push:
    branches:
      - main
      - master
      - production
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Comprobar formato
        run: cargo fmt --all -- --check

      - name: Compilar
        run: cargo build --all-targets --locked

      - name: Ejecutar tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  bun:
    name: Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Instalar dependencias Bun
        run: bun install --frozen-lockfile

      - name: Comprobar formato JavaScript
        run: bun run fmt:check

      - name: Validar JavaScript
        run: bun run build

      - name: Ejecutar tests Bun
        run: bun test --timeout 30000 ./tests/node
