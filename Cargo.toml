[package]
name = "prism_dtl"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Núcleo de liquidación en Rust para el enrutamiento del ledger distribuido Prism."

[dependencies]
blake3 = "1.8"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.7"
